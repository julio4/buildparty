name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run eval:agent:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:production-harness
      - name: Smoke production image and static serving
        run: scripts/test-production-image.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload golden E2E artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golden-e2e-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  webmcp-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check out pinned WebMCP-Bench
        env:
          WEBMCP_BENCH_COMMIT: 179b7470caf8ed7993791fac75b1a21677904a78
        run: |
          bench="$RUNNER_TEMP/webmcp-bench"
          git init "$bench"
          git -C "$bench" remote add origin https://github.com/julio4/webmcp-bench.git
          git -C "$bench" fetch --depth=1 origin "$WEBMCP_BENCH_COMMIT"
          git -C "$bench" checkout --detach FETCH_HEAD
          test "$(git -C "$bench" rev-parse HEAD)" = "$WEBMCP_BENCH_COMMIT"
      - name: Install pinned WebMCP-Bench requirements
        run: python -m pip install --requirement "$RUNNER_TEMP/webmcp-bench/requirements.txt"
      - name: Self-test BuildParty bundle
        run: python "$RUNNER_TEMP/webmcp-bench/app.py" evals/buildparty --self-test
